spring.application.name=marigoldapi
spring.profiles.active=${SPRING_PROFILES_ACTIVE:demo}

# WARNING: fallback below is committed to a public repo — local dev ONLY.
# Every deployed environment MUST set JWT_SECRET via `fly secrets set` to a
# freshly generated value (e.g. `openssl rand -base64 32`).
app.jwt.secret=${JWT_SECRET:INSECURE-DEV-ONLY-DO-NOT-USE-IN-PRODUCTION-32B-MIN}
app.jwt.expiration-minutes=60

app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:marigold}?sslmode=${POSTGRES_SSLMODE:disable}
spring.datasource.username=${POSTGRES_USER:marigold}
spring.datasource.password=${POSTGRES_PASSWORD:marigold_dev}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

management.endpoint.health.show-details=always

spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
spring.ai.anthropic.chat.options.model=claude-sonnet-5

spring.ai.vectorstore.pgvector.initialize-schema=true

spring.ai.embedding.transformer.cache.enabled=true
spring.ai.embedding.transformer.cache.directory=${user.dir}/.onnx-cache
