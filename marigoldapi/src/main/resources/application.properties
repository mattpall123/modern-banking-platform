spring.application.name=marigoldapi

spring.datasource.url=jdbc:postgresql://localhost:5433/${POSTGRES_DB:marigold}
spring.datasource.username=${POSTGRES_USER:marigold}
spring.datasource.password=${POSTGRES_PASSWORD:marigold_dev}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

management.endpoint.health.show-details=always

spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}

spring.ai.vectorstore.pgvector.initialize-schema=true
