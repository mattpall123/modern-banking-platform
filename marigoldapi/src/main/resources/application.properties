spring.application.name=marigoldapi
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-32-bytes-minimum}
app.jwt.expiration-minutes=60

spring.datasource.url=jdbc:postgresql://localhost:5433/${POSTGRES_DB:marigold}
spring.datasource.username=${POSTGRES_USER:marigold}
spring.datasource.password=${POSTGRES_PASSWORD:marigold_dev}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

management.endpoint.health.show-details=always

spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
spring.ai.anthropic.chat.options.model=claude-sonnet-5

spring.ai.vectorstore.pgvector.initialize-schema=true

spring.ai.embedding.transformer.cache.enabled=true
spring.ai.embedding.transformer.cache.directory=${user.dir}/.onnx-cache
